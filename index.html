<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Géoportail FAED</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="sidebar">
    <div class="header">
      <h1>GÉOPORTAIL FAED</h1>
      <p class="subtitle">Système de Suivi des Restaurations</p>
      <img src="logo completo vti.png" alt="ViridisTerra" class="logo">
    </div>
    
    <div class="panel">
      <h3>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="panel-icon">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        PARCELLES RESTAURÉES 2025
      </h3>
      <div class="capas-list" id="botones-capas">
      </div>
    </div>

    <div class="panel">
      <h3>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="panel-icon">
          <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
          <line x1="9" y1="3" x2="9" y2="18"></line>
          <line x1="15" y1="6" x2="15" y2="21"></line>
        </svg>
        CARTE DE BASE
      </h3>
      <div class="basemap-options">
        <label class="radio-label">
          <input type="radio" name="basemap" value="satellite" checked> 
          <span class="custom-radio"></span>
          Google Satellite
        </label>
        <label class="radio-label">
          <input type="radio" name="basemap" value="osm"> 
          <span class="custom-radio"></span>
          OpenStreetMap
        </label>
      </div>
    </div>

    <div class="panel">
      <h3>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="panel-icon">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        STATISTIQUES
      </h3>
      <div class="table-container">
        <table class="stats-table" id="tabla-estadisticas">
          <thead>
            <tr>
              <th>Nom de la Parcelle</th>
              <th class="text-right">Superficie (ha)</th>
            </tr>
          </thead>
          <tbody id="stats-body">
          </tbody>
          <tfoot>
            <tr class="total-row">
              <td>Total</td>
              <td class="text-right" id="total-area">0.00</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <div class="map-container">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
